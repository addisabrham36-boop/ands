[project]
name = "ands"
version = "2.0.0"
description = "ANDS - Live SOC Analyst & Anomaly-based Network Detection System"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "numpy>=1.24.0",
    "colorama>=0.4.6",
    "reportlab>=4.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
ANDS-shell = "core.console:main"
ands = "core.console:main"
ands-dashboard = "core.console:main"

[tool.setuptools]
packages = [
    "core",
    "modules",
    "modules.audit",
    "modules.capture",
    "modules.detect",
    "modules.generate",
    "modules.report",
    "modules.response",
    "modules.system",
    "modules.custom",
    "web"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
