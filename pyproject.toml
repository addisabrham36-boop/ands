[project]
name = "ands"
version = "1.0.0"
description = "ANDS - Anomaly-based Network Detection System"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
    "numpy>=1.24.0",
    "colorama>=0.4.6",
    "reportlab>=4.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
ANDS-shell = "core.console:main"

[tool.setuptools]
packages = ["core", "modules", "modules.capture", "modules.detect", "modules.generate", "modules.report", "modules.system"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
